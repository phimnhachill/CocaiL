name: Radar Meta Nexon Korea

on:
  schedule:
    # Quét định kỳ mỗi 30 phút một lần
    - cron: '*/30 * * * *'
  # Cho phép bấm nút chạy thử thủ công
  workflow_dispatch:

jobs:
  scan-meta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cai dat Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cai dat thu vien
        run: pip install -r requirements.txt

      - name: Chay trinh sat Meta
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_META: ${{ secrets.DISCORD_WEBHOOK_META }}
        run: python scripts/scout_meta.py

      - name: Luu lich su vao GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add database/meta_history.json || true
          git commit -m "Auto-update meta history [skip ci]" || true
          git push || true
