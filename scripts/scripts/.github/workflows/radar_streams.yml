name: Radar Streams VN Gacha

on:
  schedule:
    # Quét định kỳ mỗi 1 tiếng một lần
    - cron: '0 * * * *'
  # Cho phép bấm nút chạy thử thủ công
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-streams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cai dat Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cai dat thu vien
        run: pip install -r requirements.txt

      - name: Chay trinh sat Stream
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_GACHA: ${{ secrets.DISCORD_WEBHOOK_GACHA }}
        run: python scripts/scout_streams.py

      - name: Luu lich su va du lieu tuan vao GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add database/stream_history.json database/current_week.json || true
          git commit -m "Auto-update stream logs and weekly data [skip ci]" || true
          git push || true
